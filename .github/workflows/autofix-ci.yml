name: autofix.ci

on:
  pull_request:

permissions:
  contents: read

jobs:
  autofix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
      - run: yarn --immutable
      # Generated icons are needed so type-aware rules resolve their imports
      - run: yarn build:icons
      # Unfixable errors must not prevent pushing the fixable ones; `yarn lint` in on-code-change is the gate
      - run: yarn lint:js:fix
        continue-on-error: true
      - run: yarn lint:scss:fix
        continue-on-error: true
      - uses: autofix-ci/action@c5b2d67aa2274e7b5a18224e8171550871fc7e4a # v1.3.4

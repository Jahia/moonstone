name: A11y KPI

# Weekly accessibility audit: scripts/a11y-report.mjs runs axe on every story (both themes), the unit and
# browser suites (keyboard) and the jsx-a11y lint, then appends one row per component to the History tab of the
# KPI spreadsheet. One audit per run: if main has not moved since the last one, nothing is appended.
# The pushed rows are uploaded as an artefact (reports/audit-a11y.csv); nothing is written to git.
#
# Setup, once:
#   - repository secret A11Y_SHEET_ID = the spreadsheet id
#   - repository secret GOOGLE_SHEETS_SA_KEY = the service account JSON key, the spreadsheet
#     being shared with that account's email as an editor

on:
  schedule:
    - cron: '0 3 * * 6' # Saturday 03:00 UTC — captures the whole week, ready by Monday
  workflow_dispatch:

concurrency:
  group: a11y-kpi
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
      - name: Install dependencies
        run: yarn
      - run: yarn build:icons
      - run: yarn playwright install chromium --only-shell

      - name: Measure and append to the spreadsheet
        env:
          A11Y_SHEET_ID: ${{ secrets.A11Y_SHEET_ID }}
          GOOGLE_SHEETS_SA_KEY: ${{ secrets.GOOGLE_SHEETS_SA_KEY }}
        run: node scripts/a11y-report.mjs

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: a11y-audit
          path: reports/audit-a11y.csv
          retention-days: 30

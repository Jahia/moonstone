name: On Code Change

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # dispatched by chachalog-release-pr-checks.yml and update-screenshots.yml

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
      - name: Install dependencies
        run: yarn
      - run: yarn build
      - run: yarn playwright install chromium --only-shell
      - run: yarn test
      - run: yarn test:types
      - run: yarn lint

  visual:
    # The reference screenshots depend on the fonts of this image. Change the image and the
    # reference screenshots in the same pull request, also in update-screenshots.yml.
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
      - name: Install dependencies
        run: yarn
      - run: yarn build:icons
      - run: yarn build:lib # src/globals.scss imports dist/scoped.css
      - run: yarn playwright install chromium --only-shell
      # `github-actions` adds one annotation per failed test, and `json` gives the list of the summary.
      - name: Run visual tests
        id: visual-tests
        run: yarn test:visual --reporter github-actions --reporter json --outputFile.json="$RUNNER_TEMP/visual-tests.json"
      # Vitest writes the actual and diff images in .vitest-attachments, a hidden directory.
      - name: Upload the reference, actual and diff images
        id: upload
        if: failure() && steps.visual-tests.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-test-screenshots
          path: |
            .vitest-attachments
            src/__screenshots__
          include-hidden-files: true
          retention-days: 7
      - name: Summarize the failed visual tests
        if: failure() && steps.visual-tests.outcome == 'failure'
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          # The list is empty when the run fails before a story runs, such as a stories file that throws.
          failed=$(jq -r '.testResults[].assertionResults[] | select(.status == "failed") | "- \(.fullName)"' "$RUNNER_TEMP/visual-tests.json" | sort -u)
          {
            echo "### Visual tests failed"
            echo "- The render changed by mistake: fix the code."
            echo "- The change is intended, or the story is new: add the \`update-screenshots\` label to the pull request."
            echo
            echo "The [visual-test-screenshots]($ARTIFACT_URL) artifact holds the reference, actual and diff images."
            echo
            echo "### Failed stories"
            echo "${failed:-- none: read the log of the \"Run visual tests\" step}"
          } >> "$GITHUB_STEP_SUMMARY"

name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch: null

jobs:
  publish-release:
    runs-on: ubuntu-slim
    permissions:
      contents: write
      id-token: write
    outputs:
      released_moonstone: ${{ steps.chachalog.outputs['released_@jahia/moonstone'] }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
      - name: Build and publish
        run: |
          yarn install
          yarn workspaces foreach -vv --all --topological-dev run build
          yarn workspaces foreach -vv --all --topological --no-private npm publish --access public --tolerate-republish --provenance
      - id: chachalog
        run: npx chachalog@^0.5.3 publish-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-storybook:
    needs: publish-release
    # only run when chachalog released @jahia/moonstone
    if: needs.publish-release.outputs.released_moonstone
    runs-on: ubuntu-latest
    permissions:
      pages: write      # required to deploy to GitHub Pages
      id-token: write   # required for OIDC authentication
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }} # displays deployed URL in Actions tab
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4

      - name: Build the storybook
        run: |
          yarn install --immutable
          yarn build

      # packages storybook-static for deployment
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: storybook-static
          # v4 stopped bundling dotfiles; storybook-static/.well-known/sbom has to ship
          include-hidden-files: true

      - name: Deploy to GitHub Pages
        id: deployment # id needed to expose page_url output
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
